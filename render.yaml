services:
  - type: web
    name: effective-config-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_WORKERS
        value: '2'
      - key: APP_DEBUG
        value: 'true'
      - key: APP_LOG_LEVEL
        value: debug
